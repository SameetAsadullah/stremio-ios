name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Standard runners are free for public repositories. Larger runners are billed.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: make lint

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache frameworks
        uses: actions/cache@v6
        with:
          path: Frameworks
          key: frameworks-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: Download frameworks
        run: make bootstrap

      - name: Test
        run: make test SIMULATOR="iPhone 17 Pro"
